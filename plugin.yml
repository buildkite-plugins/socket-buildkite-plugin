name: Socket
description: Scan your dependencies for supply chain risks with Socket (socket.dev)
author: https://github.com/buildkite
requirements:
  - node
  - npm
configuration:
  properties:
    api-token-env:
      type: string
      description: >-
        Name of the environment variable that holds your Socket API token.
        Defaults to SOCKET_SECURITY_API_KEY, which the Socket CLI reads natively.
    directory:
      type: string
      description: Directory to scan. Defaults to the current directory.
    report:
      type: boolean
      description: >-
        Wait for the report and fail the build if the scan violates your
        security or license policy. Defaults to true.
    auto-manifest:
      type: boolean
      description: >-
        Auto-generate manifest files for ecosystems that require it (e.g. Gradle,
        sbt). Defaults to false.
    org:
      type: string
      description: >-
        Socket organization slug to scan under. Defaults to SOCKET_CLI_ORG_SLUG.
        Required in CI when your API token is associated with more than one org,
        otherwise the CLI cannot resolve the org non-interactively.
    repo:
      type: string
      description: >-
        Repository name to associate the scan with. Defaults to the repository
        name derived from BUILDKITE_REPO, falling back to BUILDKITE_PIPELINE_SLUG.
    branch:
      type: string
      description: Branch name to associate the scan with. Defaults to BUILDKITE_BRANCH.
    version:
      type: string
      description: Version of the Socket CLI npm package to install. Defaults to latest.
    install:
      type: boolean
      description: Install the Socket CLI via npm if it is not already available. Defaults to true.
    args:
      type: [string, array]
      description: Additional arguments passed through to the Socket CLI.
  additionalProperties: false
